name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check tag matches SKILL.md and plugin manifest
        id: version
        env:
          TAG: ${{ github.ref_name }}
        run: echo "version=$(scripts/version.sh "$TAG")" >> "$GITHUB_OUTPUT"

      - name: Install shellcheck
        run: command -v shellcheck || { sudo apt-get update && sudo apt-get install -y shellcheck; }

      - name: Lint
        run: scripts/lint.sh

      - name: Installer tests
        run: tests/test-install.sh

      - name: Build release assets
        run: scripts/build-release.sh dist

      - name: Extract release notes from CHANGELOG.md
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: scripts/release-notes.sh "$VERSION" > "$RUNNER_TEMP/notes.md"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          flags=()
          case "$TAG" in *-*) flags+=(--prerelease) ;; esac
          gh release create "$TAG" dist/* \
            --verify-tag \
            --title "$TAG" \
            --notes-file "$RUNNER_TEMP/notes.md" \
            "${flags[@]}"
